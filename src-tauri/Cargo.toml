[package]
name = "nesting-studio"
version = "0.1.0"
description = "Nesting con reglas para paneles (STEP + BOM)"
edition = "2021"

[lib]
name = "nesting_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
